name: Apply and build CTA alarm

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  alarm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply CTA web alarm patch
        run: python scripts/patch_alarmas_cta.py

      - name: Validate embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('/tmp/MOTOR_ALARMAS_VALIDAR.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          out=Path('/tmp/cta-alarm-js');out.mkdir(exist_ok=True)
          for i,block in enumerate(blocks):
              (out/f'{i:03d}.js').write_text(block,encoding='utf-8')
          print(f'{len(blocks)} bloques JavaScript extraídos')
          PY
          for file in /tmp/cta-alarm-js/*.js; do node --check "$file"; done
          node --check sw.js

      - name: Build Android companion APK
        run: gradle -p android/cta-alarm assembleDebug --stacktrace

      - name: Commit generated web changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Añade alarmas de turno al calendario CTA"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CTA-Alarma-APK
          path: android/cta-alarm/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
