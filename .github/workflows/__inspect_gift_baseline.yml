name: Inspeccion temporal regalo
on:
  push:
    paths:
      - '.github/workflows/__inspect_gift_baseline.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extraer puntos de insercion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,base64
          html=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'var\s+MOTOR_B64="([A-Za-z0-9+/=]+)";',html)
          if not m: raise SystemExit('MOTOR_B64 no encontrado')
          motor=base64.b64decode(m.group(1)).decode('utf-8')
          terms=[
            '.cambio-modo-activo','<div id="cambio-panel">','var _cambioDay=',
            'function abrirBuscadorCambio()','function abrirBuscadorCambioEmpleadoSeleccionado',
            'function _crearNoImportadoCambio','function _validarCalendarioSimCambio',
            'function calcularCambios()','function _cambioEsCompatible','function _esTurnoNormalCambio',
            'function _empleadoTieneTurnosRealesMesCambio','function _diaImportadoCambio'
          ]
          out=[]
          out.append('BASE_SHA_MARKER=6ec1d00cd14efc4305e7da02db900df5106cfae9')
          for check in ['_cambioRegalarCompleto','Regalar turno completo','ctaalarm3','Probar alarma real']:
            out.append(f'CHECK {check!r}={check in motor}')
          for t in terms:
            p=motor.find(t)
            out.append('\n===== '+t+' @ '+str(p)+' =====\n')
            if p>=0: out.append(motor[max(0,p-1800):p+5500])
          Path('__gift_baseline_diag.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/__inspect_gift_baseline.yml
          git add __gift_baseline_diag.txt
          git commit -m 'Inspeccion temporal del buscador de cambios'
          git push
