name: Validate baja hours fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/baja-conserva-horas-plantilla
      - name: Validate baja rules and embedded JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64,re
          index=Path('index.html').read_text(encoding='utf-8')
          match=re.search(r'var MOTOR_B64="([A-Za-z0-9+/=]+)";',index)
          if not match: raise SystemExit('No se encontró MOTOR_B64')
          html=base64.b64decode(match.group(1)).decode('utf-8')
          local="if(!esHL&&tipo==='baja'&&turnoOriginal&&_turnoGrupoTieneHoras(turnoOriginal))"
          shared="if(tipo==='baja'&&turnoOriginal&&_turnoGrupoTieneHoras(turnoOriginal))"
          if html.count(local)!=1: raise SystemExit(f'Regla local de BAJA: {html.count(local)}')
          if html.count(shared)!=1: raise SystemExit(f'Regla compartida de BAJA: {html.count(shared)}')
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          out=Path('/tmp/motor-scripts');out.mkdir(exist_ok=True)
          for i,block in enumerate(blocks):
              (out/f'{i:03d}.js').write_text(block,encoding='utf-8')
          print(f'Reglas de BAJA correctas; {len(blocks)} bloques JavaScript extraídos')
          PY
          for file in /tmp/motor-scripts/*.js; do node --check "$file"; done
          node --check sw.js
          grep -q "herramientas-turnos-v77" sw.js
