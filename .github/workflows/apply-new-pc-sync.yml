name: Apply new PC sync fix

on:
  push:
    branches:
      - agent/arregla-carga-pc-nuevo

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/arregla-carga-pc-nuevo
      - name: Apply patch
        run: python scripts/patch_new_pc_sync.py
      - name: Validate JavaScript
        run: |
          node --input-type=module --check < firebase-storage-sync.js
          node --check sw.js
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firebase-storage-sync.js sw.js
          git commit -m "Corrige la carga inicial en equipos nuevos"
          git push origin HEAD:agent/arregla-carga-pc-nuevo
