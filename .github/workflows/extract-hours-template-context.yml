name: Extract hours template context

on:
  push:
    branches:
      - agent/perentorias-horas-plantilla
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract relevant contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          terms = [
              'CAMBIO DEL DÍA', 'CAMBIO DEL DIA', 'Turno anterior', 'Turno actual',
              'Guardado por', 'Horas plantilla', 'horas plantilla', 'perentoria',
              'Perentoria', 'PERENTORIA', 'Google Sheets', 'google sheets',
              'Sheets', 'sheets', 'Compañeros día a día', 'compañeros día a día',
              'cambio del día', 'turno modificado'
          ]
          radius = 7000
          spans = []
          for term in terms:
              start = 0
              while True:
                  pos = text.find(term, start)
                  if pos < 0:
                      break
                  spans.append((max(0, pos-radius), min(len(text), pos+len(term)+radius), term, pos))
                  start = pos + len(term)
          spans.sort()
          merged = []
          for a,b,term,pos in spans:
              if merged and a <= merged[-1][1]:
                  merged[-1][1] = max(merged[-1][1], b)
                  merged[-1][2].append((term,pos))
              else:
                  merged.append([a,b,[(term,pos)]])
          out = []
          out.append(f'INDEX LENGTH: {len(text)}\nMATCHES: {len(spans)}\nSECTIONS: {len(merged)}\n')
          for i,(a,b,matches) in enumerate(merged,1):
              out.append(f'\n===== SECTION {i} [{a}:{b}] =====\n')
              out.append('MATCHES: '+', '.join(f'{t}@{p}' for t,p in matches)+'\n')
              out.append(text[a:b])
              out.append('\n')
          Path('hours-template-context.txt').write_text(''.join(out), encoding='utf-8')
          print(f'Extracted {len(spans)} matches into {len(merged)} sections')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hours-template-context
          path: hours-template-context.txt
          retention-days: 1
