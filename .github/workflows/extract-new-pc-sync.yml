name: Extract new PC sync context

on:
  push:
    branches:
      - agent/arregla-carga-pc-nuevo

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Firebase and embedded app contexts
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          terms = [
            'EXCLUDED_DATABASES','CHUNK_SIZE','restoreSnapshot','applyRemote','downloadSnapshot',
            'FirebaseTest','onSnapshot','indexedDB.databases','herramientas-storage-synced',
            'MOTOR_B64','iframe','srcdoc','contentWindow','postMessage','Todo está actualizado',
            'Sincronizado','Horas plantilla','cta_herramientas_solo_independiente_v2'
          ]
          radius=12000
          spans=[]
          for term in terms:
            start=0
            while True:
              pos=text.find(term,start)
              if pos<0: break
              spans.append((max(0,pos-radius),min(len(text),pos+len(term)+radius),term,pos))
              start=pos+len(term)
          spans.sort()
          merged=[]
          for a,b,t,p in spans:
            if merged and a<=merged[-1][1]:
              merged[-1][1]=max(merged[-1][1],b); merged[-1][2].append((t,p))
            else: merged.append([a,b,[(t,p)]])
          out=[f'INDEX LENGTH {len(text)} MATCHES {len(spans)} SECTIONS {len(merged)}\n']
          for i,(a,b,m) in enumerate(merged,1):
            out.append(f'\n===== SECTION {i} [{a}:{b}] =====\nMATCHES: '+', '.join(f'{t}@{p}' for t,p in m)+'\n')
            out.append(text[a:b]); out.append('\n')
          Path('new-pc-sync-context.txt').write_text(''.join(out),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: new-pc-sync-context
          path: new-pc-sync-context.txt
          retention-days: 1
